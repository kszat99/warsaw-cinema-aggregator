name: Development checks

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore:
      - 'dist/**'
      - 'outputs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Offline tests (no cinema traffic)
        run: uv run --locked pytest -q
      - name: Syntax and correctness lint
        run: uv run --locked ruff check .
      - name: Verify pip compatibility export matches the lock
        run: |
          uv export --locked --no-dev --no-emit-project --output-file requirements.txt --quiet
          git diff --exit-code -- requirements.txt
      - name: Build and install outside the source tree
        run: uv run --locked python scripts/check_wheel.py

  security:
    name: Source secrets and dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.19'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - name: Scan source without verifying credentials online
        run: uv run --locked python scripts/check_secrets.py
      - name: Audit runtime dependencies, including optional transport
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --output-file audit-requirements.txt --quiet
          uv run --locked pip-audit --require-hashes -r audit-requirements.txt
